name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify Files & Generate Configs Automatically
        run: |
          ls -la
          if [ ! -f "index.html" ]; then
            echo "ERROR: index.html is missing from the root folder!"
            exit 1
          fi
          if [ -f "app.test.cjs" ] && [ -f "question-data.js" ]; then
            node app.test.cjs
          fi
          cat << 'EOF' > package.json
          {
            "name": "ssc-mock-tester",
            "version": "1.0.0",
            "description": "SSC Mock Tester",
            "Dependencies": {},
            "devDependencies": {
              "@capacitor/android": "^6.0.0",
              "@capacitor/cli": "^6.0.0",
              "@capacitor/core": "^6.0.0"
            }
          }
          EOF
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.sscmocktester.app",
            "appName": "SSC Mock Tester",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

      - name: Install Capacitor & Generate Android Project
        run: |
          npm install
          mkdir -p www
          cp index.html www/
          if [ -f "question-data.js" ]; then cp question-data.js www/; fi
          npx cap add android
          npx cap sync android

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SSC-Mock-Tester-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
